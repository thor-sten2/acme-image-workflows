[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-image-workflows"
version = "0.1.0"
description = "Acme wrapper workflows over HuggingFace Diffusers (demo scaffold)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Acme Platform" }]
dependencies = []

[project.optional-dependencies]
diffusers = [
  "diffusers>=0.30.0",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
